[project]
name = "fleetcare-data-harvest"
version = "1.1.6"
description = "A basic web service to act as a webhook for an Azure EventGrid subscription (BlobCreated events)"
authors = [{ name = "Ashley Felton", email = "ashley.felton@dbca.wa.gov.au" }]
license = "Apache-2.0"
requires-python = ">=3.13,<4.0"

dependencies = [
  "python-dotenv==1.2.4",
  "flask==3.1.3",
  "flask-sqlalchemy==3.1.1",
  "gunicorn[fast]==26.2.0",
  "azure-storage-blob==12.31.1",
  "psycopg[binary,pool]==3.3.9",
]

[dependency-groups]
dev = ["ipython>=9.18", "ipdb>=0.13", "pre-commit>=4.6", "pytest>=9.2"]

[build-system]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 140
indent-width = 4

[tool.ruff.lint]
ignore = [
  "E501", # Line too long
  "E722", # Bare except
]
